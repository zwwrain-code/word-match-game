<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#8fd3f4">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <title>单词消消看</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23FF7A45'/%3E%3Ctext x='32' y='44' text-anchor='middle' font-size='32' font-family='sans-serif' fill='white'%3EA%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Noto+Sans+SC:wght@400;500;700&family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <div class="stage" id="stage">
      <section id="screen-home" class="screen">
        <div class="cloud cloud-a" aria-hidden="true"></div>
        <div class="cloud cloud-b" aria-hidden="true"></div>
        <div class="brand-block">
          <div class="logo-row" id="start-preview"></div>
          <h1 class="game-title">单词消消看</h1>
          <p class="game-tagline">看图识词，三张配成一组就能消掉</p>
          <p class="disclaimer" id="home-disclaimer">适合学习江苏译林小学英语。本游戏由创界科技制作，不是译林出版社的官方产品。</p>
        </div>
        <div class="course-list" id="course-list">
          <button type="button" class="btn-primary course-btn" id="btn-course-yilin3" data-course="yilin3">译林三年级</button>
          <button type="button" class="course-btn is-locked" id="btn-course-yilin4" data-course="yilin4" disabled>译林四年级<span class="soon-tag">即将开放</span></button>
          <button type="button" class="course-btn is-locked" id="btn-course-yilin5" data-course="yilin5" disabled>译林五年级<span class="soon-tag">即将开放</span></button>
          <button type="button" class="course-btn is-locked" id="btn-course-yilin6" data-course="yilin6" disabled>译林六年级<span class="soon-tag">即将开放</span></button>
          <button type="button" class="course-btn is-locked" id="btn-course-ket" data-course="ket" disabled>KET<span class="soon-tag">即将开放</span></button>
          <button type="button" class="course-btn is-locked" id="btn-course-pet" data-course="pet" disabled>PET<span class="soon-tag">即将开放</span></button>
          <button type="button" class="btn-secondary course-btn" id="btn-course-fun" data-course="fun">趣味入门</button>
          <p class="credit">创界科技</p>
        </div>
      </section>

      <section id="screen-books" class="screen hidden">
        <header class="nav-header">
          <button type="button" class="nav-back" id="btn-books-back">返回</button>
          <h2 id="books-title">译林三年级</h2>
        </header>
        <p class="disclaimer">先选上册或下册。适合学习江苏译林小学英语，不是出版社的官方产品。</p>
        <div class="choice-list">
          <button type="button" class="choice-btn" id="btn-book-3a" data-book="3a">
            <span class="choice-title">上册</span>
            <span class="choice-sub">三年级上</span>
          </button>
          <button type="button" class="choice-btn" id="btn-book-3b" data-book="3b">
            <span class="choice-title">下册</span>
            <span class="choice-sub">三年级下</span>
          </button>
        </div>
      </section>

      <section id="screen-units" class="screen hidden">
        <header class="nav-header">
          <button type="button" class="nav-back" id="btn-units-back">返回</button>
          <h2 id="units-title">上册</h2>
        </header>
        <div class="choice-list" id="unit-list"></div>
        <button type="button" class="text-home" id="btn-units-home">课程首页</button>
      </section>

      <section id="screen-game" class="screen hidden">
        <header class="game-header">
          <div class="level-badge"><button type="button" class="icon-back" id="btn-back" aria-label="返回">←</button> 第 <span id="level-num">1</span> 关 · <span id="level-name">入门</span></div>
          <div class="sets-left">剩余 <span id="sets-left">6</span> 组</div>
          <div class="helpers">
            <button type="button" class="helper-btn" id="btn-undo" aria-label="撤销">
              <span class="helper-icon">↩</span> 撤销 <span class="count" id="undo-count">2</span>
            </button>
            <button type="button" class="helper-btn" id="btn-shuffle" aria-label="洗牌">
              <span class="helper-icon">⇄</span> 洗牌 <span class="count" id="shuffle-count">2</span>
            </button>
          </div>
        </header>
        <div class="board-wrap">
          <div id="board" class="board"></div>
        </div>
        <div class="tray-wrap">
          <div id="tray" class="tray" aria-label="底部槽位"></div>
        </div>
        <footer class="game-footer">创界科技</footer>
      </section>

      <div id="overlay" class="overlay hidden" role="dialog" aria-modal="true">
        <div class="modal" id="modal"></div>
      </div>
      <div id="celebrate" class="celebrate hidden" aria-live="polite"></div>
    </div>
  </div>

  <script src="js/words.js"></script>
  <script src="js/logic.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/game.js"></script>
</body>
</html>
